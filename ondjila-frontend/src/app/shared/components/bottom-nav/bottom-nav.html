<nav class="bottom-nav" [attr.aria-label]="'a11y.bottomNav' | translate">
  @for (item of items(); track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: item.route.endsWith('/home') }"
      class="bottom-nav__item"
    >
      <span class="bottom-nav__icon" [attr.data-icon]="item.icon">{{ item.icon }}</span>
      <span class="bottom-nav__label">{{ item.labelKey | translate }}</span>
    </a>
  }
</nav>
