<nav
  class="navbar"
  [class.scrolled]="scrolled"
  [class.navbar--light]="variant() === 'light'"
  [class.navbar--hero]="variant() === 'hero'"
>
  <div class="navbar__container">
    <a routerLink="/" class="navbar__logo">
      <span class="navbar__logo-mark" aria-hidden="true"></span>
      <span class="navbar__logo-text">{{ 'common.brand' | translate }}</span>
    </a>

    <div class="navbar__links">
      <a href="#como-funciona">{{ 'nav.howItWorks' | translate }}</a>
      <a href="#precos">{{ 'nav.prices' | translate }}</a>
      <a href="#seguranca">{{ 'nav.security' | translate }}</a>
    </div>

    <div class="navbar__actions">
      <app-locale-controls [variant]="variant() === 'hero' ? 'dark' : 'default'" />
      <a routerLink="/login" class="navbar__login">{{ 'nav.login' | translate }}</a>
    </div>
  </div>
</nav>
