<header class="map-app-header" [class.map-app-header--dark]="dark()">
  <a routerLink="/passenger/home" class="map-app-header__brand">
    <span class="map-app-header__logo" aria-hidden="true">🚗</span>
    <span>{{ 'common.brand' | translate }}</span>
  </a>

  <div class="map-app-header__actions">
    <app-locale-controls [variant]="dark() ? 'glass' : 'glass'" />
    <a routerLink="/passenger/profile" class="map-app-header__avatar" [attr.aria-label]="'nav.profile' | translate">
      {{ userInitials() }}
    </a>
  </div>
</header>
