<div class="admin-topbar">
  <input
    type="search"
    class="admin-topbar__search"
    [placeholder]="'admin.searchPlaceholder' | translate"
  />
  <div class="admin-topbar__actions">
    <app-locale-controls />
    <button type="button" class="btn btn--ghost admin-topbar__export">{{ 'admin.quickExport' | translate }}</button>
    <div class="admin-topbar__user">
      <div>
        <strong>{{ 'common.adminGreeting' | translate }}</strong>
        <span>{{ 'common.adminRole' | translate }}</span>
      </div>
      <div class="admin-topbar__avatar">AD</div>
    </div>
  </div>
</div>
