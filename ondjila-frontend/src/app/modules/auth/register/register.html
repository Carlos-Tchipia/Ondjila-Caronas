<div class="auth-container">
  <div class="auth-card glass-panel">
    <div class="auth-header">
      <a routerLink="/" class="back-link">← Voltar</a>
      <h2>Cria a tua conta</h2>
      <p>Junta-te à rede de caronas mais segura de Luanda.</p>
    </div>

    <form class="auth-form">
      <div class="form-group">
        <label>Nome Completo</label>
        <input type="text" placeholder="Ex: Ana Ferreira" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="O teu melhor email" />
      </div>

      <div class="form-group">
        <label>Número de Telefone</label>
        <input type="tel" placeholder="+244 9XX XXX XXX" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Mínimo de 8 caracteres" />
      </div>

      <button type="button" class="btn btn--primary btn--large full-width" style="margin-top: 16px;">Criar Conta</button>
    </form>

    <div class="auth-footer">
      Já tens conta? <a routerLink="/login">Entrar</a>
      <br><br>
      <a href="#" style="color: var(--color-text-muted); font-size: 13px;">Queres ser motorista Ondjila? Clica aqui.</a>
    </div>
  </div>
</div>
