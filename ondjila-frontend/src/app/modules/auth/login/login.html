<div class="auth-container">
  <div class="auth-card glass-panel">
    <div class="auth-header">
      <a routerLink="/" class="back-link">← Voltar</a>
      <h2>Bem-vindo(a) de volta!</h2>
      <p>Inicia a tua sessão para viajares connosco.</p>
    </div>

    <form class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="O teu email" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="A tua senha secreta" />
      </div>

      <div class="forgot-password">
        <a href="#">Esqueceste a senha?</a>
      </div>

      <button type="button" class="btn btn--primary btn--large full-width">Entrar</button>
    </form>

    <div class="auth-footer">
      Não tens conta? <a routerLink="/register">Regista-te agora</a>
    </div>
  </div>
</div>
