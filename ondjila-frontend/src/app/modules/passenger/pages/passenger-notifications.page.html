<app-shell-page
  [titleKey]="'passenger.notificationsTitle'"
  [subtitleKey]="'passenger.notificationsSubtitle'"
  backLink="/passenger/dashboard"
>
  @for (n of items(); track n.id) {
    <article class="shell-card notif-card" [class.unread]="n.unread">
      <div class="notif-card__dot" [class.active]="n.unread"></div>
      <div>
        <h2>{{ n.titleKey | translate }}</h2>
        <p>{{ n.bodyKey | translate }}</p>
        <time>{{ n.timeKey | translate }}</time>
      </div>
    </article>
  }
</app-shell-page>
<app-bottom-nav [items]="nav" />
