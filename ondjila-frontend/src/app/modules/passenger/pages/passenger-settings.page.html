<app-shell-page title="Configurações" subtitle="Conta, idioma e preferências." backLink="/passenger/profile">
  <div class="shell-card settings-group">
    <h2>Idioma</h2>
    <div class="settings-chips">
      <button type="button" class="chip" [class.active]="language() === 'pt'" (click)="language.set('pt')">Português</button>
      <button type="button" class="chip" [class.active]="language() === 'en'" (click)="language.set('en')">English</button>
    </div>
  </div>

  <div class="shell-card settings-group">
    <h2>Aparência</h2>
    <div class="settings-chips">
      <button type="button" class="chip" [class.active]="theme() === 'light'" (click)="theme.set('light')">Claro</button>
      <button type="button" class="chip" [class.active]="theme() === 'dark'" (click)="theme.set('dark')">Escuro</button>
      <button type="button" class="chip" [class.active]="theme() === 'system'" (click)="theme.set('system')">Sistema</button>
    </div>
  </div>

  <div class="shell-card settings-group">
    <h2>Pool de caronas</h2>
    <label class="toggle-row">
      <span>Aceitar partilha de viagem</span>
      <input type="checkbox" [checked]="poolEnabled()" (change)="poolEnabled.set($any($event.target).checked)" />
    </label>
  </div>

  @if (saved()) {
    <p class="form-alert form-alert--success">Preferências guardadas.</p>
  }
  <button type="button" class="btn btn--primary full-width" (click)="save()">Guardar</button>
</app-shell-page>
<app-bottom-nav [items]="nav" />
